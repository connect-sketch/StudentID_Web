<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Portal | StudentID</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin/admin_dashboard_style.css">
    <style>
        .portal-container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin: 30px 0; }
        .stat-box { background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-box h3 { font-size: 14px; color: #64748b; margin-bottom: 10px; }
        .stat-box p { font-size: 24px; font-weight: 700; color: #a3e635; }
        .masked-name { font-family: monospace; letter-spacing: 1px; }
        .search-area { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 30px; text-align: center; }
        .ref-input { padding: 12px 20px; border: 2px solid #e2e8f0; border-radius: 8px; width: 250px; margin-right: 10px; font-size: 16px; }
        .btn-check { padding: 12px 25px; background: #a3e635; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body style="background: #f1f5f9;">
    <div class="portal-container">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="images/logo header.png" alt="Logo" style="height: 50px;">
            <h1 style="margin-top: 20px; color: #1e293b;">Influencer Performance Portal</h1>
            <p style="color: #64748b;">Track your referrals and earnings transparently.</p>
        </div>

        <div class="search-area">
            <input type="text" id="referralInput" class="ref-input" placeholder="Enter your Referral Code">
            <button onclick="checkStats()" class="btn-check">View My Stats</button>
        </div>

        <div id="statsResult" style="display: none;">
            <div class="stats-grid">
                <div class="stat-box"><h3>Total Referrals</h3><p id="totalCount">0</p></div>
                <div class="stat-box"><h3>Callbacks</h3><p id="callbackCount">0</p></div>
                <div class="stat-box"><h3>Eligibility</h3><p id="eligibilityCount">0</p></div>
                <div class="stat-box"><h3>Experts</h3><p id="expertCount">0</p></div>
            </div>

            <div class="table-container" style="background: white; border-radius: 12px; overflow: hidden;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead style="background: #f8fafc;">
                        <tr>
                            <th style="padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0;">Student Name</th>
                            <th style="padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0;">Type</th>
                            <th style="padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0;">Date</th>
                        </tr>
                    </thead>
                    <tbody id="referralTableBody">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function checkStats() {
            const refCode = document.getElementById('referralInput').value.trim();
            if (!refCode) return alert('Please enter your code');

            try {
                const res = await fetch(`/api/influencer/${refCode}`);
                if (!res.ok) throw new Error('Code not found or no data yet');
                
                const data = await res.json();
                
                document.getElementById('statsResult').style.display = 'block';
                document.getElementById('totalCount').textContent = data.total;
                document.getElementById('callbackCount').textContent = data.breakdown.callbacks;
                document.getElementById('eligibilityCount').textContent = data.breakdown.eligibility;
                document.getElementById('expertCount').textContent = data.breakdown.experts;

                const tbody = document.getElementById('referralTableBody');
                tbody.innerHTML = data.list.map(item => `
                    <tr>
                        <td style="padding: 15px; border-bottom: 1px solid #f1f5f9;" class="masked-name">${item.name}</td>
                        <td style="padding: 15px; border-bottom: 1px solid #f1f5f9;"><span class="status-badge" style="background: #ecfdf5; color: #065f46; padding: 4px 10px; border-radius: 20px; font-size: 12px;">${item.type}</span></td>
                        <td style="padding: 15px; border-bottom: 1px solid #f1f5f9; color: #64748b;">${new Date(item.date).toLocaleDateString()}</td>
                    </tr>
                `).join('');

            } catch (err) {
                alert(err.message);
            }
        }

        // Auto-load if code is in URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('ref');
        if (code) {
            document.getElementById('referralInput').value = code;
            checkStats();
        }
    </script>
</body>
</html>
